server:
  port: 8000

spring:
  application:
    name: api-gateway


  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: transaction-service
              uri: lb://TRANSACTION-GATEWAY-SERVICE
              predicates:
                - Path=/api/transactions/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:9000/eureka/


